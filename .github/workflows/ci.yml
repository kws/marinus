name: Marinus checks and test builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Linux adapter and draft contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: make check
      - run: python scripts/package-linux.py
      - run: python scripts/stage-test-build.py --component cli --platform linux-all
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-all-${{ github.sha }}
          path: dist/test-builds/cli-linux-all/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: macOS adapter (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: make check SIGN_IDENTITY=-
      - run: backends/macos/scripts/build-installer.sh --development
      - run: python scripts/stage-test-build.py --component cli --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}-${{ github.sha }}
          path: dist/test-builds/cli-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows:
    name: Windows scanner and draft contract
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-dev.txt
      - run: dotnet run --project backends/windows/tests/Marinus.Windows.Tests -c Release -- --emit-fixtures backends/windows/results/fixtures
      - run: python scripts/check-contracts.py backends/windows/results/fixtures
      - shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & ./backends/windows/scripts/build-installer.ps1 -Development -MakeNSIS $compiler
      - run: python scripts/stage-test-build.py --component cli --platform windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows-x64-${{ github.sha }}
          path: dist/test-builds/cli-windows-x64/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  desktop:
    name: Desktop development build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2025
            platform: windows-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run prepare-backend
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
        working-directory: desktop
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        working-directory: desktop
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        working-directory: desktop
      - run: npm run release -- --development
        working-directory: desktop
      - run: python scripts/stage-test-build.py --component desktop --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}
          path: dist/test-builds/desktop-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
