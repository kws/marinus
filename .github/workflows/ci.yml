name: Marinus checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Linux adapter and draft contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: make check
      - run: python scripts/package-linux.py

  macos:
    name: macOS adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: make check SIGN_IDENTITY=-
      - run: backends/macos/scripts/build-installer.sh --development

  windows:
    name: Windows scanner and draft contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-dev.txt
      - run: dotnet run --project backends/windows/tests/Marinus.Windows.Tests -c Release -- --emit-fixtures backends/windows/results/fixtures
      - run: python scripts/check-contracts.py backends/windows/results/fixtures
      - run: dotnet publish backends/windows/src/Marinus.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o backends/windows/dist
      - shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & ./backends/windows/scripts/build-installer.ps1 -Development -MakeNSIS $compiler

  desktop:
    name: Desktop development build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run prepare-backend
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
        working-directory: desktop
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        working-directory: desktop
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        working-directory: desktop
      - run: npm run release -- --development
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-development-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
