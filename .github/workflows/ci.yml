name: Marinus checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Linux prototype and draft contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: make check

  macos:
    name: macOS prototype (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: make check SIGN_IDENTITY=-

  windows:
    name: Windows scanner and draft contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-dev.txt
      - run: dotnet run --project backends/windows/tests/Marinus.Windows.Tests -c Release -- --emit-fixtures backends/windows/results/fixtures
      - run: python scripts/check-contracts.py backends/windows/results/fixtures
      - run: dotnet publish backends/windows/src/Marinus.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o backends/windows/dist
