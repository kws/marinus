[package]
name = "marinus-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros"] }

[profile.release]
strip = false
lto = true
codegen-units = 1
